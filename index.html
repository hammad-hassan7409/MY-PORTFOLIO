    <script>
      // Gracefully silence harmless Vite dev HMR WebSocket errors in sandbox preview iframe
      window.addEventListener('unhandledrejection', function(e) {
        if (!e) return;
        var r = e.reason;
        var msg = (r && (r.message || r.toString())) || '';
        if (msg.indexOf('WebSocket') !== -1 || msg.indexOf('websocket') !== -1 || msg.indexOf('closed without opened') !== -1) {
          e.preventDefault();
        }
      });
      window.addEventListener('error', function(e) {
        if (!e) return;
        var msg = (e.message || '') + '';
        if (msg.indexOf('WebSocket') !== -1 || msg.indexOf('websocket') !== -1 || msg.indexOf('closed without opened') !== -1) {
          e.preventDefault();
        }
      });
    </script>

  </body>
